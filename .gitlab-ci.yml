stages:
  - test
  - build

# ── Python: unit tests, smoke tests, API tests ──────────────────
python-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  before_script:
    - pip install -r agent/requirements.txt -r ui/api/requirements.txt pytest httpx --quiet
  script:
    - python -m pytest tests/smoke_test.py -v
    - python -m pytest tests/test_tools_unit.py -v
    - python -m pytest tests/test_api.py -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── CDK: TypeScript compile check ────────────────────────────────
cdk-compile:
  stage: test
  image: node:20-slim
  cache:
    key: npm-infra-$CI_COMMIT_REF_SLUG
    paths:
      - infra/node_modules/
  before_script:
    - cd infra && npm ci --quiet
  script:
    - npx tsc --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Frontend: build check ───────────────────────────────────────
frontend-build:
  stage: test
  image: node:20-slim
  cache:
    key: npm-frontend-$CI_COMMIT_REF_SLUG
    paths:
      - ui/frontend/node_modules/
  before_script:
    - cd ui/frontend && npm ci --quiet
  script:
    - npx tsc --noEmit
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Docker: build check (no push) ──────────────────────────────
docker-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t patchy-test --build-arg BUILD_TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ) .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
