name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python: unit tests, smoke tests, API tests ──────────────────
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt

      - name: Install API dependencies
        run: pip install -r ui/api/requirements.txt

      - name: Install test dependencies
        run: pip install pytest httpx

      - name: Run smoke tests
        run: python -m pytest tests/smoke_test.py -v

      - name: Run unit tests
        run: python -m pytest tests/test_tools_unit.py -v

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v

  # ── CDK: synthesis check ────────────────────────────────────────
  cdk-synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

  # ── Frontend: build check ───────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Docker: build check (no push) ──────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t patchy-test --build-arg BUILD_TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ) .
